[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ocr-client"
version = "0.1.1"
description = "CLI client for the Unlimited-OCR LAN service (server.py FastAPI gateway)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Unlimited-OCR LAN service" },
]
keywords = ["ocr", "unlimited-ocr", "pdf", "cli", "lan"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
rich = ["rich>=13.7"]
all = ["ocr-client[rich]"]

[project.scripts]
ocr-client = "ocr_client.cli:main"

[project.urls]
"Source" = "https://github.com/anomalyco/opencode"
"Server contract" = "https://github.com/anomalyco/opencode/blob/main/Unlimited-OCR/API_CONTRACT.md"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_client"]

[tool.hatch.build.targets.sdist]
exclude = [".venv*", "dist", "build", "*.egg-info", "__pycache__"]
